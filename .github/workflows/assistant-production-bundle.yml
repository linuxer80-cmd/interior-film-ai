name: Assistant production unsigned AAB
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed source commit SHA
        required: true
        type: string
      version_code:
        description: Unused versionCode higher than every Play track
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: assistant-production-bundle
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASSISTANT_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Validate release inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_SHA"]), "Use a full commit SHA"
          v = os.environ["ASSISTANT_VERSION_CODE"]
          assert v.isdecimal() and 20072 < int(v) <= 2100000000, "Invalid release versionCode"
          PYCODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Restore production Firebase configuration
        env:
          FIREBASE_JSON: ${{ secrets.ASSISTANT_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib
          raw = os.environ.get("FIREBASE_JSON", "")
          if not raw:
              raise SystemExit("Missing ASSISTANT_GOOGLE_SERVICES_JSON repository secret")
          data = json.loads(raw)
          assert data["project_info"]["project_id"] != "field-assistant-test-only"
          assert any(c["client_info"]["android_client_info"]["package_name"] == "kr.fieldassistant.prototype.stable" for c in data["client"])
          pathlib.Path("android-ai-assistant/app/google-services.json").write_text(raw)
          PYCODE
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
      - name: Prepare native speech engine and model
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
          mkdir -p android-ai-assistant/vendor android-ai-assistant/app/src/main/assets
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git android-ai-assistant/vendor/whisper
          test "$(git -C android-ai-assistant/vendor/whisper rev-parse HEAD)" = a8d002cfd879315632a579e73f0148d06959de36
          curl -fsSL --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin -o android-ai-assistant/app/src/main/assets/ggml-small-q5_1.bin
          cd android-ai-assistant/app/src/main/assets
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c
          sha256sum ggml-small-q5_1.bin > whisper-model.sha256
      - name: Test and build production unsigned bundle
        working-directory: android-ai-assistant
        run: gradle --no-daemon --max-workers=2 :app:testReleaseUnitTest :app:bundleRelease
      - name: Record build provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir -p release-output
          cp android-ai-assistant/app/build/outputs/bundle/release/app-release.aab release-output/assistant-unsigned.aab
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          p = pathlib.Path("release-output/assistant-unsigned.aab")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert commit == os.environ["SOURCE_SHA"]
          data = {"source_sha": commit, "version_code": int(os.environ["ASSISTANT_VERSION_CODE"]), "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "signed": False, "run_id": os.environ["GITHUB_RUN_ID"]}
          pathlib.Path("release-output/provenance.json").write_text(json.dumps(data, indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-production-unsigned-${{ inputs.version_code }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7
      - name: Remove restored Firebase configuration
        if: always()
        run: rm -f android-ai-assistant/app/google-services.json
