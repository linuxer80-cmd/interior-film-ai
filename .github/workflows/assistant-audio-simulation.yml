name: Assistant synthetic audio simulation
on:
  push:
    branches: [codex/assistant-audio-simulation-20261102]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Prepare public speech model and synthetic recording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-ai-assistant/app/src/main/assets android-ai-assistant/app/src/debug/assets
          curl -fsSL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip -o android-ai-assistant/app/src/main/assets/vosk-ko.zip
          echo 'eea36124087fed26c59996a4761519458e3bd185e8ea9d9865ad8760c4a1d989  android-ai-assistant/app/src/main/assets/vosk-ko.zip' | sha256sum -c -
          python -m pip install --disable-pip-version-check 'edge-tts==7.3.1' 'imageio-ffmpeg==0.6.0'
          edge-tts --voice ko-KR-SunHiNeural --text '안녕하세요. 싱크대 인테리어 필름 시공 견적 부탁드립니다. 견적을 알려 주세요.' --write-media /tmp/assistant-synthetic.mp3
          ffmpeg_bin="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$ffmpeg_bin" -v error -y -i /tmp/assistant-synthetic.mp3 -ar 16000 -ac 1 -c:a aac -b:a 96k android-ai-assistant/app/src/debug/assets/fixture.m4a
          "$ffmpeg_bin" -v error -y -i /tmp/assistant-synthetic.mp3 -ar 16000 -ac 1 -f s16le android-ai-assistant/app/src/debug/assets/fixture.pcm
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run synthetic recording on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash -c 'cd android-ai-assistant; ASSISTANT_VERSION_CODE=19999 gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=kr.fieldassistant.prototype.SchedulingTest; result=$?; adb logcat -d -s AssistantTest:I TestRunner:E "*:S" | tail -250; exit "$result"'
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-audio-simulation-report
          path: android-ai-assistant/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 3
