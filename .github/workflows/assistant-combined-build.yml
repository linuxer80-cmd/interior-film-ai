name: Assistant combined APK build
on:
  pull_request:
    paths: [android-ai-assistant/**, .github/workflows/assistant-combined-build.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Prepare Android platform and test-only Firebase configuration
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          cat > android-ai-assistant/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"field-assistant-test-only"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef","android_client_info":{"package_name":"kr.fieldassistant.prototype.stable"}},"api_key":[{"current_key":"test-build-only-not-a-real-api-key"}]}],"configuration_version":"1"}
          JSON
      - name: Prepare native speech engine and model
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
          mkdir -p android-ai-assistant/vendor android-ai-assistant/app/src/main/assets
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git android-ai-assistant/vendor/whisper
          test "$(git -C android-ai-assistant/vendor/whisper rev-parse HEAD)" = a8d002cfd879315632a579e73f0148d06959de36
          curl -fsSL --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin -o android-ai-assistant/app/src/main/assets/ggml-small-q5_1.bin
          cd android-ai-assistant/app/src/main/assets
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c
          sha256sum ggml-small-q5_1.bin > whisper-model.sha256
      - name: Compile, test and build debug and optimized release
        working-directory: android-ai-assistant
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: material-workflow-test-results
          path: android-ai-assistant/app/build/test-results/testDebugUnitTest
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-combined-debug-apk
          path: android-ai-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verify release optimization metadata
        run: |
          set -euo pipefail
          test -s android-ai-assistant/app/build/outputs/mapping/release/mapping.txt
          grep -q '^kr.fieldassistant.prototype.WhisperNative -> kr.fieldassistant.prototype.WhisperNative:' android-ai-assistant/app/build/outputs/mapping/release/mapping.txt
          unzip -l android-ai-assistant/app/build/outputs/bundle/release/app-release.aab | grep -E 'r8.json|proguard.map'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-optimization-diagnostics-test-only
          path: android-ai-assistant/app/build/outputs/mapping/release/
          retention-days: 7
      - name: Test application launch on Android emulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libnss3 libxkbcommon-x11-0 libxcb-cursor0
          export QT_QPA_PLATFORM=offscreen
          export ANDROID_AVD_HOME="$RUNNER_TEMP/assistant-avd"
          mkdir -p "$ANDROID_AVD_HOME" android-ai-assistant/launch-output
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name assistant-smoke --package "system-images;android-35;google_apis;x86_64" --force --path "$ANDROID_AVD_HOME/assistant-smoke.avd"
          "$ANDROID_HOME/emulator/emulator" -avd assistant-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/assistant-emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" start-server
          timeout 180 "$ADB" wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          "$ADB" shell input keyevent 82
          "$ADB" install -r android-ai-assistant/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" logcat -c
          "$ADB" shell am start -W -n kr.fieldassistant.prototype.stable/kr.fieldassistant.prototype.MainActivity
          sleep 10
          "$ADB" shell pidof kr.fieldassistant.prototype.stable
          "$ADB" logcat -d -s AndroidRuntime:E > android-ai-assistant/launch-output/runtime.log
          if grep -q 'FATAL EXCEPTION' android-ai-assistant/launch-output/runtime.log; then cat android-ai-assistant/launch-output/runtime.log; exit 1; fi
          "$ADB" exec-out screencap -p > android-ai-assistant/launch-output/launch.png
          "$ADB" uninstall kr.fieldassistant.prototype.stable
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/release-test.keystore" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -dname "CN=Test only" -keyalg RSA -keysize 2048 -validity 1 >/dev/null 2>&1
          "$SIGNER" sign --ks "$RUNNER_TEMP/release-test.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/release-test.apk" android-ai-assistant/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ADB" install "$RUNNER_TEMP/release-test.apk"
          "$ADB" logcat -c
          "$ADB" shell am start -W -n kr.fieldassistant.prototype.stable/kr.fieldassistant.prototype.MainActivity
          sleep 10
          "$ADB" shell pidof kr.fieldassistant.prototype.stable
          "$ADB" logcat -d -s AndroidRuntime:E > android-ai-assistant/launch-output/release-runtime.log
          if grep -q 'FATAL EXCEPTION' android-ai-assistant/launch-output/release-runtime.log; then cat android-ai-assistant/launch-output/release-runtime.log; exit 1; fi
          "$ADB" shell uiautomator dump /sdcard/assistant-window.xml
          "$ADB" pull /sdcard/assistant-window.xml android-ai-assistant/launch-output/window.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assistant-emulator-launch
          path: android-ai-assistant/launch-output/
          retention-days: 3
