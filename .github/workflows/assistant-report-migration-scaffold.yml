name: Generate assistant report migration scaffold
on:
  push:
    branches: [codex/assistant-design-20261106]
    paths: [.github/workflows/assistant-report-migration-scaffold.yml]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate migration through the Supabase CLI
        run: |
          supabase migration new assistant_safe_report_resubmission
          mkdir -p "$RUNNER_TEMP/migration-scaffold"
          cp supabase/migrations/*_assistant_safe_report_resubmission.sql "$RUNNER_TEMP/migration-scaffold/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assistant-report-migration-scaffold
          path: ${{ runner.temp }}/migration-scaffold/*.sql
          if-no-files-found: error
          retention-days: 1
