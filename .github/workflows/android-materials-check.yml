name: Android material workflow checks
on:
  pull_request:
    paths: [android-ai-assistant/**, .github/workflows/android-materials-check.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Prepare Android platform and test-only Firebase configuration
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          cat > android-ai-assistant/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"field-assistant-test-only"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef","android_client_info":{"package_name":"kr.fieldassistant.prototype.stable"}},"api_key":[{"current_key":"test-build-only-not-a-real-api-key"}]}],"configuration_version":"1"}
          JSON
      - name: Compile and test native material workflows
        working-directory: android-ai-assistant
        run: gradle --no-daemon --max-workers=2 :app:compileDebugKotlin :app:testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: material-workflow-test-results
          path: android-ai-assistant/app/build/test-results/testDebugUnitTest
          retention-days: 3
