name: Android assistant test build
on:
  push:
    branches: [codex/android-field-assistant-prototype, codex/sample-catalog-verification]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Prepare Whisper engine and multilingual model
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
          mkdir -p android-ai-assistant/vendor android-ai-assistant/app/src/main/assets
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git android-ai-assistant/vendor/whisper
          test "$(git -C android-ai-assistant/vendor/whisper rev-parse HEAD)" = a8d002cfd879315632a579e73f0148d06959de36
          curl -fsSL --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin -o android-ai-assistant/app/src/main/assets/ggml-small-q5_1.bin
          cd android-ai-assistant/app/src/main/assets
          sha256sum ggml-small-q5_1.bin > whisper-model.sha256
      - name: Build local validation CLI
        shell: bash
        run: |
          set -euo pipefail
          cmake -S android-ai-assistant/vendor/whisper -B /tmp/whisper-cli-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build /tmp/whisper-cli-build --target whisper-cli -j 2
          mkdir -p android-ai-assistant/validation-output
          cp /tmp/whisper-cli-build/bin/whisper-cli android-ai-assistant/validation-output/
          cp android-ai-assistant/app/src/main/assets/ggml-small-q5_1.bin android-ai-assistant/validation-output/
          cp android-ai-assistant/app/src/main/assets/whisper-model.sha256 android-ai-assistant/validation-output/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whisper-local-validation
          path: android-ai-assistant/validation-output/
          retention-days: 1
      - name: Build test APK
        working-directory: android-ai-assistant
        run: ASSISTANT_VERSION_CODE="$((10000 + GITHUB_RUN_NUMBER))" gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Prepare APK and Android signing tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-ai-assistant/signing-output
          cp android-ai-assistant/app/build/outputs/apk/debug/app-debug.apk android-ai-assistant/signing-output/app-debug.apk
          TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -print | sort -V | tail -n 1)"
          test -f "$TOOL"
          cp "$TOOL" android-ai-assistant/signing-output/apksigner.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: field-assistant-android-test
          path: android-ai-assistant/signing-output/
          if-no-files-found: error
          retention-days: 7
      - name: Launch APK on Android 35 emulator
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p android-ai-assistant/launch-output
          trap 'cp /tmp/assistant-emulator.log android-ai-assistant/launch-output/emulator.log 2>/dev/null || true; tail -n 100 /tmp/assistant-emulator.log 2>/dev/null || true' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libnss3 libxkbcommon-x11-0 libxcb-cursor0
          export QT_QPA_PLATFORM=offscreen
          export ANDROID_AVD_HOME="$RUNNER_TEMP/assistant-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          sudo chmod 666 /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name assistant-smoke --package "system-images;android-35;google_apis;x86_64" --force --path "$ANDROID_AVD_HOME/assistant-smoke.avd"
          "$ANDROID_HOME/emulator/emulator" -avd assistant-smoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/assistant-emulator.log 2>&1 &
          ADB="$ANDROID_HOME/platform-tools/adb"
          emulator_pid=$!
          "$ADB" start-server
          for attempt in $(seq 1 30); do
            kill -0 "$emulator_pid"
            if "$ADB" devices | grep -q 'emulator-'; then break; fi
            sleep 2
          done
          timeout 120 "$ADB" wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [ "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          "$ADB" shell input keyevent 82
          "$ADB" install -r android-ai-assistant/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" logcat -c
          "$ADB" shell am start -W -n kr.fieldassistant.prototype.stable/kr.fieldassistant.prototype.MainActivity
          sleep 10
          "$ADB" shell pidof kr.fieldassistant.prototype.stable
          mkdir -p android-ai-assistant/launch-output
          "$ADB" logcat -d -s AndroidRuntime:E > android-ai-assistant/launch-output/runtime.log
          if grep -q 'FATAL EXCEPTION' android-ai-assistant/launch-output/runtime.log; then cat android-ai-assistant/launch-output/runtime.log; exit 1; fi
          "$ADB" exec-out screencap -p > android-ai-assistant/launch-output/launch.png
          "$ADB" shell uiautomator dump /sdcard/assistant-window.xml
          "$ADB" pull /sdcard/assistant-window.xml android-ai-assistant/launch-output/window.xml
          python3 - <<'PY'
          import re, subprocess, os, xml.etree.ElementTree as ET
          root = ET.parse("android-ai-assistant/launch-output/window.xml").getroot()
          adb = os.environ["ANDROID_HOME"]+"/platform-tools/adb"
          for attempt in range(6):
              node = next((n for n in root.iter("node") if n.attrib.get("text") == "필름장이 웹앱 열기"),None)
              if node is not None: break
              subprocess.run([adb,"shell","input","swipe","160","490","160","180","400"],check=True)
              subprocess.run([adb,"shell","uiautomator","dump","/sdcard/scroll.xml"],check=True)
              subprocess.run([adb,"pull","/sdcard/scroll.xml","/tmp/scroll.xml"],check=True)
              root = ET.parse("/tmp/scroll.xml").getroot()
          assert node is not None, "Web workspace button not found"
          x1,y1,x2,y2 = map(int,re.findall(r"\d+",node.attrib["bounds"]))
          subprocess.run([os.environ["ANDROID_HOME"]+"/platform-tools/adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)
          PY
          sleep 10
          "$ADB" shell pidof kr.fieldassistant.prototype.stable
          "$ADB" shell dumpsys activity activities > android-ai-assistant/launch-output/web-activity.txt
          grep -Eq '(topResumedActivity|mResumedActivity|ResumedActivity).*WebWorkspaceActivity' android-ai-assistant/launch-output/web-activity.txt
          "$ADB" logcat -d -s AndroidRuntime:E > android-ai-assistant/launch-output/web-runtime.log
          if grep -q 'FATAL EXCEPTION' android-ai-assistant/launch-output/web-runtime.log; then cat android-ai-assistant/launch-output/web-runtime.log; exit 1; fi
          "$ADB" exec-out screencap -p > android-ai-assistant/launch-output/web.png
          "$ADB" shell am start -W -a android.intent.action.VIEW -d 'filmjang-assistant://auth/kakao?state=invalid' -n kr.fieldassistant.prototype.stable/kr.fieldassistant.prototype.KakaoCallbackActivity
          sleep 2
          "$ADB" shell pidof kr.fieldassistant.prototype.stable
          "$ADB" logcat -d -s AndroidRuntime:E > android-ai-assistant/launch-output/callback-runtime.log
          if grep -q 'FATAL EXCEPTION' android-ai-assistant/launch-output/callback-runtime.log; then cat android-ai-assistant/launch-output/callback-runtime.log; exit 1; fi
          "$ADB" shell uiautomator dump /sdcard/callback-window.xml
          "$ADB" pull /sdcard/callback-window.xml android-ai-assistant/launch-output/callback-window.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          nodes = list(ET.parse("android-ai-assistant/launch-output/window.xml").getroot().iter("node"))
          assert any(n.get("text") == "카카오로 로그인" for n in nodes)
          assert any(n.get("password") == "true" for n in nodes)
          callbacks = list(ET.parse("android-ai-assistant/launch-output/callback-window.xml").getroot().iter("node"))
          assert any(n.get("text") == "로그인으로 돌아가기" for n in callbacks)
          PY
          "$ADB" shell am force-stop kr.fieldassistant.prototype.stable
          "$ADB" shell am start -W -n kr.fieldassistant.prototype.stable/kr.fieldassistant.prototype.MainActivity
          sleep 5
          "$ADB" shell pidof kr.fieldassistant.prototype.stable
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assistant-launch-check
          path: android-ai-assistant/launch-output/
          retention-days: 3
