name: Android assistant test build
on:
  push:
    branches: [codex/android-field-assistant-prototype]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Build test APK
        working-directory: android-ai-assistant
        run: ASSISTANT_VERSION_CODE="$((10000 + GITHUB_RUN_NUMBER))" gradle --no-daemon assembleDebug
      - name: Prepare APK and Android signing tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-ai-assistant/signing-output
          cp android-ai-assistant/app/build/outputs/apk/debug/app-debug.apk android-ai-assistant/signing-output/app-debug.apk
          TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -print | sort -V | tail -n 1)"
          test -f "$TOOL"
          cp "$TOOL" android-ai-assistant/signing-output/apksigner.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: field-assistant-android-test
          path: android-ai-assistant/signing-output/
          if-no-files-found: error
          retention-days: 7
